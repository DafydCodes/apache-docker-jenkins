```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Screensaver</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #screensaver {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #windows {
            position: absolute;
            width: 180px;
            height: 180px;
            left: 100px;
            top: 100px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Arial Black", Arial, sans-serif;
            font-size: 42px;
            font-weight: 900;
            color: white;

            text-shadow:
                3px 3px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000;

            user-select: none;
        }

        /* Windows logo */
        .logo {
            width: 120px;
            height: 120px;
            transform: skewY(-8deg) rotate(-2deg);

            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 5px;
        }

        .pane {
            border: 2px solid #111;
            box-shadow: inset 2px 2px rgba(255,255,255,0.35);
        }

        .pane:nth-child(1) {
            background: #f44336;
        }

        .pane:nth-child(2) {
            background: #00a8ff;
        }

        .pane:nth-child(3) {
            background: #00c853;
        }

        .pane:nth-child(4) {
            background: #ffc400;
        }

        #hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #555;
            font-size: 13px;
            font-family: "Courier New", monospace;
        }
    </style>
</head>

<body>

<div id="screensaver">

    <div id="windows">
        <div class="logo">
            <div class="pane"></div>
            <div class="pane"></div>
            <div class="pane"></div>
            <div class="pane"></div>
        </div>
    </div>

    <div id="hint">Windows Screensaver</div>

</div>

<script>

    const windows = document.getElementById("windows");
    const screen = document.getElementById("screensaver");

    let x = 100;
    let y = 100;

    // Movement speed
    let dx = 2.5;
    let dy = 2.0;

    function animate() {

        const screenWidth = screen.clientWidth;
        const screenHeight = screen.clientHeight;

        const objectWidth = windows.offsetWidth;
        const objectHeight = windows.offsetHeight;

        x += dx;
        y += dy;

        // Hit left/right wall
        if (x <= 0) {
            x = 0;
            dx = -dx;
        }

        if (x + objectWidth >= screenWidth) {
            x = screenWidth - objectWidth;
            dx = -dx;
        }

        // Hit top/bottom wall
        if (y <= 0) {
            y = 0;
            dy = -dy;
        }

        if (y + objectHeight >= screenHeight) {
            y = screenHeight - objectHeight;
            dy = -dy;
        }

        windows.style.left = x + "px";
        windows.style.top = y + "px";

        requestAnimationFrame(animate);
    }

    animate();

</script>

</body>
</html>
